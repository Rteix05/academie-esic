# Limitation de débit des endpoints publics sensibles (anti brute-force / spam)
framework:
    rate_limiter:
        # Inscription : 5 comptes par heure et par IP
        registration:
            policy: 'sliding_window'
            limit: 5
            interval: '1 hour'
        # Mot de passe oublié : 3 demandes par 15 min et par IP + email
        forgot_password:
            policy: 'sliding_window'
            limit: 3
            interval: '15 minutes'
        # Réinitialisation : 10 tentatives par 15 min et par IP
        reset_password:
            policy: 'sliding_window'
            limit: 10
            interval: '15 minutes'

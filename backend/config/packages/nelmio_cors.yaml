nelmio_cors:
    defaults:
        origin_regex: true
        allow_origin: ['%env(CORS_ALLOW_ORIGIN)%']
        allow_methods: ['GET', 'OPTIONS', 'POST', 'PUT', 'PATCH', 'DELETE']
        allow_headers: ['Content-Type', 'Authorization', 'Accept']
        expose_headers: ['Link']
        max_age: 3600
    paths:
        '^/api/':
            # Origine exacte du frontend (pas de regex) : obligatoire avec les cookies
            origin_regex: false
            allow_origin: ['%env(FRONTEND_URL)%']
            # Autorise l'envoi du cookie httpOnly BEARER (fetch avec credentials: 'include')
            allow_credentials: true
            allow_methods: ['GET', 'OPTIONS', 'POST', 'PUT', 'PATCH', 'DELETE']
            allow_headers: ['Content-Type', 'Authorization', 'Accept']
            max_age: 3600

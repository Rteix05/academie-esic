parameters:
    # Valeurs par défaut sûres : à surcharger via l'environnement
    #   - dev en http://localhost : JWT_COOKIE_SECURE=0
    #   - frontend et API sur deux sites différents en prod : JWT_COOKIE_SAMESITE=none (+ Secure obligatoire)
    env(JWT_COOKIE_SECURE): '1'
    env(JWT_COOKIE_SAMESITE): 'lax'
    env(JWT_TOKEN_TTL): '3600'

lexik_jwt_authentication:
    secret_key: '%env(resolve:JWT_SECRET_KEY)%'
    public_key: '%env(resolve:JWT_PUBLIC_KEY)%'
    pass_phrase: '%env(JWT_PASSPHRASE)%'
    token_ttl: '%env(int:JWT_TOKEN_TTL)%'

    # Le JWT voyage dans un cookie httpOnly : illisible par JavaScript, donc hors de portée d'une XSS.
    # L'en-tête Authorization reste accepté pour les clients non-navigateur (scripts, Postman…).
    token_extractors:
        authorization_header:
            enabled: true
        cookie:
            enabled: true
            name: BEARER

    set_cookies:
        BEARER:
            # null = même durée de vie que le token
            lifetime: null
            samesite: '%env(JWT_COOKIE_SAMESITE)%'
            path: /
            secure: '%env(bool:JWT_COOKIE_SECURE)%'
            httpOnly: true

    # Le token n'est plus renvoyé dans le corps de la réponse de login
    remove_token_from_body_when_cookies_used: true
